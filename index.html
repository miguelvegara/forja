<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15181B">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Forja">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body><title>Forja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: one-column phone app, max 560px. A dark "iron" hero card on Hoy, chalk-paper surfaces elsewhere.
   Colour comes from calibrated weight plates: red 25 kg = protein, yellow 15 kg = carbs, green 10 kg = fat, blue 20 kg = accent. */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#EBEDE7; --ink:#15181B; --muted:#5E6762; --line:#DCDFD7;
  --accent:#2B4BD8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --hero:#15181B; --hero-ink:#F4F5F0; --hero-muted:#A3ABA6; --hero-line:rgba(255,255,255,.12);
  --p:#D7263D; --c:#DB9C00; --f:#1F8A57;
  --ok:#1F8A57; --warn:#B86A00; --bad:#C9283D;
  --shadow:0 1px 2px rgba(21,24,27,.05),0 12px 28px -20px rgba(21,24,27,.35);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F11; --surface:#16191C; --sunk:#1F2327; --ink:#EDEFEA; --muted:#9AA29D; --line:#2A2F33;
  --accent:#7D95FF; --accent-ink:#0D0F11; --accent-soft:#1E2643;
  --hero:#1C2125; --hero-ink:#F4F5F0; --hero-muted:#A3ABA6; --hero-line:rgba(255,255,255,.1);
  --p:#FF5C70; --c:#F4C043; --f:#43C487; --ok:#43C487; --warn:#F2A33A; --bad:#FF5C70; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D0F11; --surface:#16191C; --sunk:#1F2327; --ink:#EDEFEA; --muted:#9AA29D; --line:#2A2F33;
  --accent:#7D95FF; --accent-ink:#0D0F11; --accent-soft:#1E2643;
  --hero:#1C2125; --hero-ink:#F4F5F0; --hero-muted:#A3ABA6; --hero-line:rgba(255,255,255,.1);
  --p:#FF5C70; --c:#F4C043; --f:#43C487; --ok:#43C487; --warn:#F2A33A; --bad:#FF5C70; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(100px + env(safe-area-inset-bottom,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.onb{padding-bottom:24px}
body.onb .tabs{display:none}
.app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1;text-transform:uppercase}
h1{font-size:38px} h2{font-size:27px} h3{font-size:21px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 12px;display:flex;align-items:center;gap:10px}
.top .datebox{flex:1;min-width:0;text-align:center}
.top .datebox b{font-family:var(--display);font-weight:800;font-size:24px;display:block;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.icon-btn svg{width:18px;height:18px}
.sync{font-size:11px;color:var(--muted);font-weight:600}

.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{background:transparent;border-style:dashed;box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:11px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 6px;box-shadow:none}
.field{display:grid;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);padding:0 12px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--accent);background:var(--surface);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* hero (Hoy) */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px;display:grid;gap:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:18px solid rgba(255,255,255,.04);pointer-events:none}
.hero .eyebrow{color:var(--hero-muted)}
.hero h1{font-size:44px}
.hero .pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.hero-body{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center}
.hero-body>*,.plate-wrap>*{min-width:0}
.hero>.spread{flex-wrap:wrap;row-gap:8px}
.hero>.spread>div{min-width:0}
.hero h1{overflow-wrap:anywhere}
.hero .plate{width:128px;height:128px}
.hero .plate .center span{color:var(--hero-muted)}
.hero .mbar .mtop{color:var(--hero-ink)}
.hero .track{background:rgba(255,255,255,.1)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hero-line);padding-top:14px}
.hero-stats div{display:grid;gap:2px;padding:0 4px}
.hero-stats div+div{border-left:1px solid var(--hero-line);padding-left:12px}
.hero-stats b{font-family:var(--display);font-size:26px;line-height:1;font-weight:800}
.hero-stats span{font-size:11px;color:var(--hero-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

/* kcal plate */
.plate-wrap{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center}
.plate{position:relative;width:128px;height:128px}
.plate svg{width:100%;height:100%;transform:rotate(-90deg)}
.plate .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.plate .center b{font-family:var(--display);font-size:34px;line-height:1;font-weight:800}
.plate .center span{font-size:11px;color:var(--muted);font-weight:600}
.mbars{display:grid;gap:11px}
.mbar .mtop{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:5px}
.track i{display:block;height:100%;border-radius:99px}
.mbar.p i{background:var(--p)} .mbar.c i{background:var(--c)} .mbar.f i{background:var(--f)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.dot.p{background:var(--p)} .dot.c{background:var(--c)} .dot.f{background:var(--f)}

/* food */
.meal h3{display:flex;justify-content:space-between;align-items:baseline}
.meal h3 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;text-transform:none}
.fitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line)}
.fitem:first-of-type{border-top:0}
.fitem .nm{font-weight:600;min-width:0}
.fitem .q{font-size:13px;color:var(--muted)}
.fitem .acts{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:4px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk)}
.step button{width:38px;height:38px;border:0;background:transparent;font-size:18px;font-weight:700}
.step span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.unit{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted);font-weight:700;vertical-align:1px}
.hands{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.hand{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--sunk)}
.hand b{font-family:var(--display);font-size:20px;display:block;text-transform:uppercase}
.hand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--muted)}
details[open] summary::after{content:"－"}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,10,12,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .list{overflow:auto;margin-top:10px;min-height:0;flex:1}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:10px;scrollbar-width:none}
.pick{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;padding:11px 4px;border:0;border-top:1px solid var(--line);background:transparent}
.pick .nm{font-weight:600} .pick .q{font-size:13px;color:var(--muted)} .pick .k{grid-row:1/3;grid-column:2;align-self:center;font-weight:700;font-variant-numeric:tabular-nums}

/* training */
.ex{display:grid;gap:12px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head h3{font-size:22px}
.presc{font-family:var(--display);font-size:20px;color:var(--muted);font-weight:800;white-space:nowrap}
.hint{font-size:13px;padding:9px 12px;border-radius:12px;background:var(--sunk)}
.hint.up{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ink)}
.hint.warnhint{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.sets{display:grid;gap:7px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 50px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);text-align:center}
.set .inp{height:46px;text-align:center;font-weight:600;font-size:16px}
.set .lab{font-size:10px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.set.next .inp{outline:2px solid var(--ok);outline-offset:1px}
.done{width:50px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center}
.done svg{width:20px;height:20px;opacity:.3}
.done.on{background:var(--ok);border-color:var(--ok)}
.done.on svg{opacity:1;color:#fff}
.timer{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:8px}
.timer .in{width:100%;max-width:560px;background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.timer b{font-family:var(--display);font-size:34px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;min-width:72px}
.timer .lbl{flex:1;min-width:0;font-size:0;visibility:hidden} /* sin texto: solo tiempo y botones */
.tbar{position:absolute;left:0;right:0;bottom:0;height:4px}.tbar i{display:block;height:100%;width:0;background:var(--accent)}
.timer .in.go{background:var(--ok);color:#fff;animation:pulse 1s ease-in-out 3}
.timer .in.go.late{background:var(--warn,#d9534f);animation:none}
@keyframes pulse{50%{transform:scale(1.03)}}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;height:36px;padding:0 11px;font-weight:600}

/* progress */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi b{font-family:var(--display);font-size:32px;display:block;line-height:1;font-weight:800}
.kpi span{font-size:12px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:9px 4px;border-top:1px solid var(--line);text-align:left}
table.t th{font-size:11px;color:var(--muted);font-weight:700;border-top:0;text-transform:uppercase;letter-spacing:.08em}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.callout{padding:12px 14px;background:var(--sunk);border-radius:14px;font-size:14px;border-left:4px solid var(--accent)}
.callout.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.callout.ok{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px}
.tabs button{border:0;background:transparent;height:58px;display:grid;place-items:center;align-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);border-radius:14px}
.tabs button span{white-space:nowrap}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.mblk{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:grid;gap:8px}
.mblk:first-child{border-top:0;margin-top:4px;padding-top:0}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mhead .eyebrow{color:var(--accent)}
.mdish{font-weight:700;font-size:16px;line-height:1.25}
.mextra{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.daystrip{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;gap:4px}
.daystrip button.wk{border:0;background:none;justify-content:center;color:var(--ink)}
.daystrip button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--muted);font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.daystrip button b{font-size:15px;color:var(--ink)}
.daystrip button.today{border-color:var(--p)}
.daystrip button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.daystrip button.on b{color:var(--bg)}
.mhow{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 10px}
.frow{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:8px 0;border-top:1px dashed var(--line)}
.frow .fn{font-weight:600;font-size:14px;min-width:0}
.frow .fq{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.frow .fh{font-size:12px;color:var(--muted)}
.frow .fh.r{text-align:right}
.frow .feq{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:3px}
.frow .feq b{color:var(--ink);font-weight:600}
.mtot{display:flex;gap:6px;flex-wrap:wrap}
.swapbtn{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.swapbtn span{color:var(--accent);text-decoration:none}
.toggle{width:52px;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--sunk);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:var(--muted);transition:left .15s}
.toggle.on{background:var(--ok);border-color:var(--ok)}
.toggle.on::after{left:23px;background:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--sunk);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;min-height:40px;font-weight:600;font-size:14px;padding:0 6px;border-radius:10px;line-height:1.15}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toast{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:14px;font-weight:500}
.toast button{background:transparent;border:0;color:inherit;display:grid;place-items:center;width:28px;height:28px}
.phase{display:grid;gap:3px}.phase b{font-family:var(--display);font-size:32px;line-height:1;font-weight:800;text-transform:uppercase}
.warnchip{background:var(--warn);color:#fff;border-color:var(--warn)}
.sync[data-s="saving"]{color:var(--warn)}.sync[data-s="cloud"],.sync[data-s="local"]{color:var(--ok)}

/* onboarding */
.onb-wrap{min-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:22px;padding-block:28px 8px}
.onb-steps{display:flex;gap:6px}.onb-steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.onb-steps i.on{background:var(--accent)}
.onb-hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:28px 22px;display:grid;gap:14px;position:relative;overflow:hidden}
.onb-hero h1{font-size:64px;line-height:.9}
.onb-hero p{margin:0;color:var(--hero-muted);font-size:16px;max-width:34ch}
.plates{display:flex;gap:6px;align-items:center;margin-top:6px}
.plates span{display:block;border-radius:5px}
.opt{display:grid;gap:2px;text-align:left;width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.opt b{font-size:16px}.opt span{font-size:13px;color:var(--muted)}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.onb-foot{margin-top:auto;display:grid;grid-template-columns:auto 1fr;gap:10px}
.err{color:var(--bad);font-size:13px;font-weight:600}

const STRIDE={desayuno:1,comida:3,merienda:1,cena:1,recena:1};
function blockOf(k){
  const m=monday(k),wn=Math.round((pk(m)-pk('2026-10-26'))/(7*864e5)),dow=(pk(k).getDay()+6)%7,half=dow<=3?0:1;
  return{wn,b:wn*2+half,key:m+(half?'b':'a'),start:half?add(m,4):m,len:half?3:4};
}
/* Plan simple mediterráneo: desayuno y merienda fijos; comida y cena cambian cada semana (lun-jue / vie-dom) */
const SIMPLE={desayuno:[['tostadas'],['tostadas']],merienda:[['batido'],['batido']],
  comida:[['currypollo','polloarroz','pavopasta','pavopatata'],['legumbrepollo','lentejasarroz','garbanzos']],
  cena:[['sardinascena','atunpasta'],['pollocena','pastapollo','merluza','burger']]};
const SIMPLE_FROM='2026-11-09';
function optFor(k,meal){
  const bl=blockOf(k),list=OPTS[meal],ex=(state.settings.mex||{})[meal]||[];
  if(state.settings.simple!==false&&k>=SIMPLE_FROM&&SIMPLE[meal]){
    const ids=SIMPLE[meal][bl.len===4?0:1].filter(id=>!ex.includes(id)),pool=(ids.length?ids:SIMPLE[meal][bl.len===4?0:1]).map(id=>list.find(o=>o.id===id)).filter(Boolean);
    const shift=((state.settings.mswap||{})[bl.key+'|'+meal])||0;
    if(pool.length)return pool[((bl.wn+shift)%pool.length+pool.length)%pool.length]}
  let src=list,base=(meal==='desayuno'||meal==='merienda')?bl.wn:bl.b;
  if(meal==='recena')base=bl.wn;
  if(meal==='cena'){const half=bl.b%2;src=list.filter(o=>!!o.fish===!!half);base=bl.wn}
  /* Mediterránea: la comida de vie-dom siempre es de legumbre (3 veces por semana) */
  if(meal==='comida'&&bl.len===3&&k>='2026-11-09'){const lg=list.filter(o=>o.i.some(x=>x[0]==='legumbre'||x[0]==='lentejas'));if(lg.length)src=lg;base=bl.wn}
  const ok=src.filter(o=>!ex.includes(o.id));const pool=ok.length?ok:src;
  const shift=((state.settings.mswap||{})[bl.key+'|'+meal])||0;
  const i=((base*STRIDE[meal]+shift)%pool.length+pool.length)%pool.length;
  return pool[i];
}
const FREE={comida:{id:'libreC',n:'Comida libre',how:'Lo que haya, en casa o fuera. Regla del plato: 1-2 palmas de carne o pescado, 1-2 puños de arroz, pasta, patata, pan o legumbre y medio plato de verdura o ensalada. Sin repetir. Agua. De postre fruta o nada.',i:[['libreC',1,'x']]},

function menuTpl(k){const m={},names={},fm=state.settings.freeMid===true;mealPlan().forEach(ml=>{const o=fm&&FREE[ml]?FREE[ml]:optFor(k,ml);m[ml]=o.i;names[ml]=o});
  const simp=state.settings.simple!==false&&k>=SIMPLE_FROM;
  if(state.settings.mode==='cut'&&m.cena&&!simp)m.cena=[...m.cena,['batido',.75,'x']];
  if(simp&&m.cena)m.cena=[...m.cena,['yogur',1,'x'],['judias',1,'x']]; /* plan simple: siempre 1 yogur de postre y brócoli de guarnición */
  if(state.settings.mode==='cut'&&m.comida&&!fm)m.comida=[...m.comida,['ensalada',1,'x'],...(simp?[]:[['fruta',1,'x']])];
  /* Compra mensual: solo alimentos que aguantan un mes (verdura congelada, fruta de nevera) */
  if((state.settings.shopDays||7)>=14){const alt=(pk(k).getDate()%2)?'judias':'brocoli';
    for(const ml in m){const has=new Set(m[ml].map(x=>x[0]));const pick=['judias','espinacas','brocoli'].find(v=>!has.has(v))||alt;m[ml]=m[ml].map(([f,q,r])=>f==='ensalada'?[pick,q,r]:f==='platano'&&!['platano','mix'].includes(state.settings.fruitPref)?['fruta',q,r]:f==='aguacate'?['nueces',q*11/15,r]:[f,q,r])}} /* al definir: más verdura y fruta, sacian y dan fibra */ /* al definir: postre de skyr para no perder calcio ni proteína sin merienda */
  /* Energía para entrenar: los días de entreno la merienda lleva un plátano más. Las calorías del día no suben: la app recorta hidratos en el resto. */
  if(trainsOn(k)&&m.merienda&&!fm)m.merienda=[...m.merienda,['platano',1,'x']];
  return{m,names,k}}
function trainsOn(k){const t=dayType(k);return !!ROUTINE[t]}
/* Horario del día, calculado desde la hora de entreno */
const toMin=t=>{const[a,b]=String(t||'20:00').split(':').map(Number);return (a||0)*60+(b||0)};
const toHM=x=>{x=((Math.round(x/5)*5)%1440+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
function dayTimes(k=ui.cur){
  const T=toMin(state.settings.trainTime),train=trainsOn(k),late=T>=16*60,type=dayType(k),R=ROUTINE[type];
  const dur=!train?0:R?dayTotalMin(R):walkPlan(k).min;
  return{T,train,late,dur,desayuno:state.settings.wakeGoal?toMin(state.settings.wakeGoal)+30:8.5*60,comida:14*60,merienda:train&&late?T-150:17.5*60,cena:train&&late?T+dur+15:21*60}}
function dayRows(k=ui.cur){
  const d=dayTimes(k),tp=menuTpl(k),meals=mealPlan(),nm=m=>tp.names[m]?tp.names[m].n:'',rows=[];
  const add=(t,h,x,c)=>rows.push({t,h,x,c});
  const pl=Math.round(buildMenu(tp).filter(i=>i.m==='merienda'&&i.f==='platano').reduce((n,i)=>n+i.q,0))||1;
  if(meals.includes('desayuno'))add(state.settings.wakeGoal?toMin(state.settings.wakeGoal)+30:8.5*60,'Desayuno',nm('desayuno'));
  if(meals.includes('comida'))add(d.comida,'Comida',d.train&&d.late?nm('comida')+'. Cómela entera: de aquí sale gran parte de la energía.':nm('comida'));
  if(d.train&&d.late)add(Math.min(15*60,d.T-300),'Último café','A partir de aquí nada de cafeína ni preentreno, para dormir bien.');
  if(d.train&&!d.late)add(d.T-45,'Plátano','Un plátano 45 min antes y un vaso de agua. Es un extra del menú.');
  if(meals.includes('merienda'))add(d.merienda,'Merienda',d.train&&d.late?nm('merienda')+`, con ${pl===1?'1 plátano':pl+' plátanos'}. Es tu comida de antes de entrenar.`:nm('merienda'));
  else if(d.train&&d.late)add(d.T-90,'Antes de entrenar','Guarda la fruta de la comida y tómala ahora. Sin merienda, esto es lo que te da energía.');
  if(d.train)add(d.T,'Entreno',d.dur+' min. Agua durante toda la tarde.',1);
  if(meals.includes('cena'))add(d.cena,'Cena',nm('cena'));
  if(meals.includes('recena'))add(d.cena+90,'Recena',nm('recena'));
  return rows.sort((a,b)=>a.t-b.t)}
/* Menú de la semana: junta los días que comen lo mismo */
function weekCard(){
  const DN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],mon=monday(ui.cur),ms=mealPlan(),gs=[];
  for(let i=0;i<7;i++){const k=add(mon,i),n=menuTpl(k).names,sig=ms.map(m=>n[m].n).join('|'),g=gs[gs.length-1];
    if(g&&g.sig===sig)g.to=i;else gs.push({sig,from:i,to:i,n});
    if(k===TODAY)gs[gs.length-1].today=1}
  const lab=g=>g.from===g.to?DN[g.from]:DN[g.from]+' a '+DN[g.to];
  return `<section class="card stack"><h2>Menú de la semana</h2>${gs.map((g,i)=>`<div style="${i?'padding-top:12px;border-top:1px solid var(--line)':''}"><div class="spread"><span class="eyebrow">${lab(g)}</span>${g.today?'<span class="chip on">Hoy</span>':''}</div>${ms.map(m=>`<div class="small" style="margin-top:6px"><span class="muted">${esc(MEALS.find(x=>x[0]===m)[1])}:</span> ${esc(g.n[m].n)}</div>`).join('')}</div>`).join('')}</section>`}
function mealHour(m,k=ui.cur){const d=dayTimes(k);return d[m]!=null?toHM(d[m]):''}
function scheduleCard(){
  const rows=dayRows(),now=new Date(),nm=ui.cur===TODAY?now.getHours()*60+now.getMinutes():-1;
  const next=ui.cur===TODAY?rows.findIndex(r=>r.t>=nm):-1;
  return `<section class="card stack"><h2>Horario de hoy</h2><label class="spread small muted">Hora de entreno<input class="inp" style="width:120px;padding:6px 8px" type="time" aria-label="Hora de entreno" data-sn="trainTime" value="${esc(state.settings.trainTime||'20:00')}"></label>
    <div>${rows.map((r,i)=>`<div class="row" style="gap:12px;align-items:flex-start;padding:9px 0;${i?'border-top:1px solid var(--line);':''}"><b class="num" style="min-width:48px${i===next?';color:var(--ok)':''}">${toHM(r.t)}</b><span style="min-width:0"><b>${esc(r.h)}</b>${i===next?' <span class="unit">ahora toca</span>':''}<br><span class="small muted">${esc(r.x)}</span></span></div>`).join('')}</div>
  </section>`}

const ROUTINE={};
const LEGDAYS=['piernaA','piernaB','fbA','fbB','fbC'];
const HIP_EX=['hip','Hip thrust',4,8,12,120,5,['Puente de glúteo en máquina']],ABD_EX=['abductor','Abductores en máquina',3,12,20,60,2.5,['Abducción con banda']];
function rebuildRoutine(){
  const s=state.settings,f=s.sex==='f',g=s.focus==='glute';
  for(const k in ROUTINE)delete ROUTINE[k];
  for(const k in BASE_R){const R=BASE_R[k];let ex=R.ex.map(a=>a.slice());
    if(f||g)ex=ex.filter(a=>a[0]!=='neck'&&a[0]!=='neckExt');
    if(g){ex=ex.map(a=>a[0]==='lateral'?[a[0],a[1],Math.min(3,a[2]),...a.slice(3)]:a);
      if(LEGDAYS.includes(k)){if(!ex.some(a=>a[0]==='hip'))ex.unshift(HIP_EX.slice());if(!ex.some(a=>a[0]==='abductor'))ex.splice(ex.length-1,0,ABD_EX.slice())}}
    const budget=Math.max(30,(s.walkMin||80)-(s.commute||0)),RR={ex};
    const DROP=['neck','neckExt','piernasColgado','crunch','triFrances','triCuerda','curlInc','curl','curlMartillo','fondos','gemelo','cuadri','patada','aperInv'];
    const dec=(from)=>{let bi=-1;for(let i=from;i<ex.length;i++)if(ex[i][2]>2&&(bi<0||ex[i][2]>=ex[bi][2]))bi=i;if(bi<0)return false;ex[bi]=[ex[bi][0],ex[bi][1],ex[bi][2]-1,...ex[bi].slice(3)];return true};
    for(let guard=0;guard<60&&liftMin(RR)>budget;guard++){
      if(dec(2))continue;
      const di=ex.findIndex(e=>DROP.includes(e[0]));if(di>=0&&ex.length>4){ex.splice(di,1);continue}
      if(dec(0))continue;
      let li=-1;for(let i=ex.length-1;i>=2;i--)if(!['lateral','hip','abductor'].includes(ex[i][0])){li=i;break}
      if(li>=0&&ex.length>4){ex.splice(li,1);continue}
      break;
    }
    ROUTINE[k]={n:R.n,focus:g&&LEGDAYS.includes(k)?R.focus.replace('Cuádriceps','Glúteo, cuádriceps').replace(/^Pierna/,'Glúteo, pierna'):R.focus,ex};
  }
}

function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pk(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function add(k,n){const d=pk(k);d.setDate(d.getDate()+n);return dk(d)}

function monday(k){const d=pk(k);const w=(d.getDay()+6)%7;return add(k,-w)}
function nice(k){
  if(k===TODAY) return 'Hoy';
  if(k===add(TODAY,-1)) return 'Ayer';
  if(k===add(TODAY,1)) return 'Mañana';
  return pk(k).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});
}

   Cada documento lleva _t (hora del último cambio). Siempre gana el más reciente.

  async get(k){const db=IDB.db||await IDB.open();if(!db)return null;return new Promise(r=>{try{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null)}catch(e){r(null)}})},

function docOf(id){return id==='settings'?state.settings:state.days[id.slice(2)]}
function hasContent(o){
  if(!o)return false;if(o._t)return true;
  for(const k in o){const v=o[k];
    if(k==='foods'){if(v&&v.length)return true}
    else if(k==='sets'){for(const e in (v||{}))if((v[e]||[]).some(s=>s&&(s.kg!=null||s.reps!=null||s.done)))return true}
    else if(k==='hab'){if(v&&Object.keys(v).length)return true}
    else if(v!=null&&v!==false&&v!=='')return true}
  return false;
}
let col=null,cloudState='local',flushT=null,flushing=false,synced=false;
function touch(id){const o=docOf(id);if(!o)return;o._t=Date.now();dirty.add(id);lsSave();setSync();schedule(500)}
const saveDay=(k=ui.cur)=>touch('d-'+k);
const saveSettings=()=>touch('settings');
function schedule(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms)}
async function writeDoc(id){
  const o=docOf(id);if(!o){dirty.delete(id);return}
  const t=o._t,data=clone(o);
  await col.doc(id).set(data);
  const now=docOf(id);if(now&&now._t===t)dirty.delete(id);
}
async function flush(){
  clearTimeout(flushT);
  if(!col||!dirty.size){setSync();return}
  if(flushing){schedule(400);return}
  flushing=true;setSync('saving');
  for(const id of [...dirty]){
    try{await writeDoc(id)}
    catch(e){
      const c=e&&e.code;
      if(c==='invalid_argument'||c==='transform_error'){dirty.delete(id)}
      else if(c==='quota_exceeded'){ui.toast='Tu almacenamiento está lleno. Exporta una copia en Plan.';break}
      else if(c==='revoked'||c==='not_granted'){col=null;break}
      else{await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await writeDoc(id)}catch(_){}}
    }
  }
  flushing=false;lsSave();setSync();
  if(dirty.size&&col)schedule(15000);
}
function setSync(force){
  cloudState=force||(col?(dirty.size?'saving':'cloud'):'local');
  const el=$('#sync');if(!el)return;
  el.textContent={cloud:'✓ Guardado en tu cuenta',saving:'Guardando…',local:STANDALONE?'✓ Guardado en este móvil':'✓ Guardado en este dispositivo'}[cloudState];
  el.dataset.s=cloudState;
}
function applyRemote(id,r){
  if(id==='settings')state.settings={...DEF,...clone(r)};
  else if(id.startsWith('d-'))state.days[id.slice(2)]=clone(r);
}
async function initCloud(){
  try{
    if(!window.claude||!claude.use){migrate();return}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){migrate();return}
    const id=await user.id();
    if(!id){migrate();return}
    col=db.collection('data/users/'+id);
    setSync('saving');
    col.onSnapshot(snap=>{
      let changed=false;const seen=new Set();
      snap.docs.forEach(d=>{
        const id=d.id;seen.add(id);
        if(id!=='settings'&&!id.startsWith('d-'))return;
        if(dirty.has(id))return;
        const r=d.data(),l=docOf(id);
        const rt=r._t||0,lt=id==='settings'?(l._t||-1):(hasContent(l)?(l._t||0):-1);
        if(rt>lt){applyRemote(id,r);changed=true}
        else if(!snap.metadata.fromCache&&lt>=0&&(lt>rt||JSON.stringify(r)!==JSON.stringify(l))){if(!l._t)l._t=Date.now();dirty.add(id)}
      });
      if(!snap.metadata.fromCache&&!synced){
        synced=true;migrate();
        if(!seen.has('settings'))dirty.add('settings');
        Object.keys(state.days).forEach(k=>{if(!seen.has('d-'+k)&&hasContent(state.days[k])){if(!state.days[k]._t)state.days[k]._t=Date.now();dirty.add('d-'+k)}});
      }
      if(changed){lsSave();autoPhase(true);safeRender()}
      if(dirty.size)schedule(300);else setSync();
    },()=>{col=null;setSync();setTimeout(()=>{synced=false;initCloud()},20000)});
  }catch(e){}
}

  (tp._extra||[]).forEach(([m,f,q])=>{const ex=items.find(i=>i.m===m&&i.f===f&&i.role==='x');if(ex)ex.q+=q;else items.push({m,f,q,role:'x',auto:1})});
  {const fp=state.settings.fruitPref;if(fp==='platano')items.forEach(i=>{if(i.f==='fruta')i.f='platano'});
   else if(fp==='mix'){let c=false;items.forEach(i=>{if(i.f==='fruta'){if(!c&&i.q>=1){c=true;if(i.q>1){items.push({...i,f:'platano',q:i.q-1});i.q=1}i.f='citrico'}else i.f='platano'}});if(!c)items.push({m:items.some(x=>x.m==='merienda')?'merienda':'desayuno',f:'citrico',q:1,role:'x',auto:1})}}
  {const seen={};for(let n=items.length-1;n>=0;n--){const i=items[n],k=i.m+'|'+i.f+'|'+i.role;if(seen[k]){seen[k].q+=i.q;items.splice(n,1)}else seen[k]=i}}
  const sum=(fn,flt)=>items.filter(flt).reduce((a,i)=>a+F[i.f][fn]*i.q,0);
  for(let it=0;it<3;it++){
    const pP=sum('P',i=>i.role==='p'),oP=sum('P',i=>i.role!=='p');
    const kp=pP>0?Math.min(3,Math.max(.5,(t.P-oP)/pP)):1;items.filter(i=>i.role==='p').forEach(i=>i.q*=kp);
    const fF=sum('F',i=>i.role==='f'),oF=sum('F',i=>i.role!=='f');
    const kf=fF>0?Math.min(3,Math.max(0,(t.F-oF)/fF)):1;items.filter(i=>i.role==='f').forEach(i=>i.q*=kf);
    const cK=sum('k',i=>i.role==='c'),oK=sum('k',i=>i.role!=='c');
    const kc=cK>0?Math.min(3,Math.max(.3,(t.kcal-oK)/cK)):1;items.filter(i=>i.role==='c').forEach(i=>i.q*=kc);
  }
  items.forEach(i=>{const st=F[i.f].step||.5;i.q=Math.max(i.role==='p'?1:st,Math.round(i.q/st)*st)});
  const carbs=items.filter(i=>i.role==='c');
  for(let n=0;n<12&&carbs.length;n++){
    const diff=menuTotals(items).k-t.kcal;if(Math.abs(diff)<=90)break;
    const c=diff>0?carbs.reduce((a,b)=>a.q*F[a.f].k>=b.q*F[b.f].k?a:b):carbs.reduce((a,b)=>a.q*F[a.f].k<=b.q*F[b.f].k?a:b);
    const st=F[c.f].step||.5;if(diff>0&&c.q-st<st)break;c.q=+(c.q+(diff>0?-st:st)).toFixed(2);
  }
  return items;
}
function micOf(list){const t={};MIC_KEYS.forEach(k=>t[k]=0);list.forEach(([f,q])=>{const m=F[f]&&F[f].mic;if(m)MIC_KEYS.forEach(k=>t[k]+=m[k]*q)});return t}
function micCard(k){
  const d=peek(k),logged=d&&(d.foods||[]).filter(e=>e.f).length;
  const today=micOf(logged?d.foods.filter(e=>e.f).map(e=>[e.f,e.q]):buildMenu(menuTpl(k)).map(i=>[i.f,i.q]));
  const wk={o3:0,D:0};for(let i=0;i<7;i++){const m=micOf(buildMenu(menuTpl(add(monday(k),i))).map(x=>[x.f,x.q]));wk.o3+=m.o3/7;wk.D+=m.D/7}
  const row=(key,val,note)=>{const [t,n,u]=MIC_T[key];const mx=MIC_MAX[key];const pc=Math.round(val/t*100);
    let st,col;if(mx&&val>mx){st='Te pasas';col='var(--bad)'}else if(pc>=90){st='Bien';col='var(--ok)'}else if(pc>=60){st='Algo corto';col='var(--warn)'}else{st='Corto';col='var(--bad)'}
    const fmt=v=>v>=100?nf(Math.round(v)):nf(v,v<10?1:0);
    return `<div><div class="spread small"><span>${n}${note?` <span class="muted">${note}</span>`:''}</span><span class="num" style="color:${col};font-weight:700">${st}</span></div>
      <div class="track"><i style="width:${Math.min(100,pc)}%;background:${col}"></i></div>
      <div class="spread small muted num" style="margin-top:2px"><span>${fmt(val)} ${u}</span><span>ideal ${fmt(t)}${mx?` · máx ${fmt(mx)}`:''} ${u}</span></div></div>`};
  const low=MIC_KEYS.filter(x=>x!=='o3'&&x!=='D').filter(x=>today[x]/MIC_T[x][0]<.9);
  const high=MIC_KEYS.filter(x=>MIC_MAX[x]&&today[x]>MIC_MAX[x]);
  const tips={fib:'Añade un puño más de verdura o una pieza de fruta.',Ca:'Un vaso de leche, un yogur o una lata de sardinas lo cubren.',Fe:'Legumbre o ternera en la comida.',Mg:'Un puñado de frutos secos o legumbre.',K:'Patata, plátano o legumbre.',vC:'Una naranja o 2 mandarinas.',Zn:'Ternera o legumbre.'};
  return `<section class="card stack"><div class="spread"><h3>Micronutrientes</h3><span class="small muted">${logged?'lo que has apuntado':'menú de hoy'}</span></div>
    ${['fib','Ca','Fe','Mg','K','vC','Zn'].map(x=>row(x,today[x])).join('')}
    ${row('o3',wk.o3,'media semanal')}${row('D',wk.D,'media semanal')}
    ${low.length?`<div class="callout warn small"><b>Para completar:</b> ${low.map(x=>esc(tips[x])).join(' ')}</div>`:''}
    ${high.length?`<div class="callout warn small">Te pasas de ${high.map(x=>MIC_T[x][1].toLowerCase()).join(', ')}. Con comida normal es raro: revisa si tomas algún suplemento que lo lleve.</div>`:''}
    <p class="small muted" style="margin:0">Pasarse del ideal con comida es normal y sano (el hierro y el zinc de la carne, la vitamina C de la fruta). El problema llega solo por encima del máximo, casi siempre por suplementos. Por eso no tomes hierro ni multivitamínicos sin analítica.</p>
    ${wk.o3<MIC_T.o3[0]*.9?`<div class="callout warn small">Esta semana el pescado del menú es blanco. Añade 1-2 latas de sardinas o caballa (por ejemplo en la merienda) y llegas al omega-3.</div>`:''}
    ${wk.D<MIC_T.D[0]*.9?`<p class="small muted" style="margin:0">La vitamina D casi no viene de la comida: sale del sol. 15-20 min de sol en cara y brazos a mediodía la mayoría de días. En invierno, pregunta al médico si te conviene un suplemento y mírala en la analítica anual.</p>`:''}
    <p class="small muted" style="margin:0">Valores aproximados por ración. Sirven para ver qué falta, no para contar miligramos.</p>
  </section>`;
}
function menuTotals(items){return items.reduce((a,i)=>{const f=F[i.f];a.k+=f.k*i.q;a.P+=f.P*i.q;a.C+=f.C*i.q;a.F+=f.F*i.q;return a},{k:0,P:0,C:0,F:0})}


/* ================= HÁBITOS Y SUEÑO ================= */
function sleepH(d){
  if(!d)return null;
  if(d.bed&&d.wake){const[a,b]=d.bed.split(':').map(Number),[c,e]=d.wake.split(':').map(Number);let m=(c*60+e)-(a*60+b);if(m<=0)m+=1440;return m/60}
  return d.sleep!=null?d.sleep:null;
}
const fmtH=h=>Math.floor(h)+' h '+String(Math.round((h%1)*60)).padStart(2,'0');
function moved(d,k){const t=dayType(k);if(t==='rest')return true;if(!d)return false;if(ROUTINE[t])return Object.values(d.sets||{}).flat().some(s=>s&&s.done);if(t==='walk')return!!d.walk||(d.steps>=stepTarget(k));return false}
/* Lo esencial: lo que más pesa para gustar (cuerpo, cara, pelo y trato). Nada más. */
const HAB=[
 {g:'Al levantarte',k:'sleep',n:'Anoche dormiste 7,5 h o más',auto:d=>{const h=sleepH(d);return h!=null&&h>=7.5}},
 {g:'Al levantarte',k:'peso',n:'Pesarte en ayunas, tras el baño',auto:d=>!!(d&&d.weight)},
 {g:'Al levantarte',k:'medir',n:'Lunes: medir cintura y cuello',auto:(d,k)=>{if(pk(k).getDay()!==1){const lm=lastMeasure();return !!lm&&lm.k>add(k,-8)}return !!(d&&d.waist&&d.neck)}},
 {g:'Al levantarte',k:'piel',n:'Piel: limpiador, hidratante y protector solar'},
 {g:'Al levantarte',k:'pelo',n:'Pelo: espuma con el pelo húmedo y difusor'},
 {g:'Al levantarte',k:'crea',n:'Desayuno del menú con la creatina (5 g) en la leche'},
 {g:'Durante el día',k:'move',n:'Entreno del día hecho',auto:(d,k)=>{const t=dayType(k);if(!ROUTINE[t])return true;return !!d&&Object.values(d.sets||{}).flat().some(s=>s&&s.done)}},
 {g:'Durante el día',k:'steps',n:'Pasos',auto:(d,k)=>!!(d&&effSteps(d)>=stepTarget(k))},
 {g:'Durante el día',k:'chinwk',n:'Chin tucks 2 × 10 en el coche (cabeza contra el reposacabezas) o en casa'},
 {g:'Durante el día',k:'social',n:'Hablar con alguien nuevo o hacer un plan con gente'},
 {g:'Por la noche',k:'menu',n:'Cena del menú'},
 {g:'Por la noche',k:'cama',n:'A la cama a tu hora, móvil fuera de la habitación'}
];
function habOn(h,d,k){if(h.auto)return h.auto(d,k);if(!d)return false;if(h.k==='crea')return!!d.crea;return!!(d.hab&&d.hab[h.k])}
function habScore(k){const d=peek(k);return HAB.filter(h=>habOn(h,d,k)).length}

  </header>${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}<button data-a="toast-x" aria-label="Cerrar">${sicon('x',14)}</button></div>`:''}`;
}
function plateSvg(val,tgt,dark){
  const R=54,C=2*Math.PI*R,p=Math.min(1,tgt?val/tgt:0),over=val>tgt*1.05;
  const rim=dark?'rgba(255,255,255,.06)':'var(--sunk)',track=dark?'rgba(255,255,255,.12)':'var(--line)',hub=dark?'var(--hero)':'var(--surface)';
  return `<svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="64" fill="${rim}"/>
    <circle cx="66" cy="66" r="${R}" fill="none" stroke="${track}" stroke-width="13"/>
    ${p>0?`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${over?'var(--bad)':'var(--accent)'}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${Math.max(0,C*p-1)} ${C}"/>`:''}
    <circle cx="66" cy="66" r="44" fill="${hub}"/><circle cx="66" cy="66" r="7" fill="${dark?'rgba(255,255,255,.08)':'var(--sunk)'}"/></svg>`;
}

function wheyInfo(k=ui.cur){
  const tg=targets().P,d=peek(k),lg=(d&&d.foods||[]).filter(e=>e.f||e.c);

  if(!lg.length){const m=buildMenu(menuTpl(k));const w=wq(m);const where=[...new Set(m.filter(e=>e.f==='whey').map(e=>(MEALS.find(x=>x[0]===e.m)||[,e.m])[1].toLowerCase()))];
    return{mode:'plan',tg,w,where}}
  const P=totals(k).P,gap=tg-P,w=wq(lg),late=k<TODAY||new Date().getHours()>=20;
  const n=Math.min(2-Math.min(2,w),Math.max(.5,Math.round(gap/24*2)/2));

}

          ${ex.alts.length?`<button class="btn ghost sm" data-a="swap-open" data-v="${ex.key}">${open?'Cerrar':'Cambiar'}</button>`:''}</div>
        ${open?`<div class="stack" style="gap:6px">${[ex.orig,...ex.alts].map((n,i)=>`<button class="btn sm ${i===ex.idx?'primary':''}" style="justify-content:flex-start" data-a="swap" data-v="${ex.key}" data-i="${i}">${esc(n)}</button>`).join('')}
          <p class="small muted" style="margin:0">El cambio vale para todas las sesiones. El historial de cada variante se guarda por separado.</p></div>`:''}
      </section>`;
    });
    html+=`<section class="card flat small muted">Con el cuello empieza muy ligero (2,5-5 kg) y movimiento lento: nada de tirones.</section>`;
    if(cintaMin(R))html+=`<section class="card stack"><div class="spread"><h3>Cinta inclinada · ${cintaMin(R)} min</h3><button class="toggle ${d.cinta?'on':''}" data-a="cinta" aria-pressed="${!!d.cinta}" aria-label="Cinta hecha"></button></div><p class="small muted" style="margin:0">Al acabar las pesas, para completar tus ${state.settings.walkMin} min de hoy. Inclinación 8-12 %, unos 5 km/h, sin agarrarte.</p></section>`;
  }
  if(!R)html+=stepsCard();
  if(type==='rest')html=`<section class="card"><h2>Descanso</h2><p class="muted small" style="margin:6px 0 0">Hoy no toca nada.</p></section>`+html;
  return header()+`<div class="stack"><section class="card">${dayStrip()}</section>${typeSel}${html}${R?cintaCard(d):''}</div>`;
}

function weightChart(){
  const R=ui.wr||90;
  let ws=weights();if(R)ws=ws.filter(([k])=>k>add(TODAY,-R));
  const seg=`<div class="seg">${[[90,'3 meses'],[365,'1 año'],[0,'Todo']].map(([n,l])=>`<button data-a="wr" data-v="${n}" class="${R===n?'on':''}">${l}</button>`).join('')}</div>`;
  if(ws.length<2)return seg+`<p class="small muted" style="margin:0">Apunta tu peso unos días en Hoy y aquí verás la tendencia.</p>`;
  const span=(pk(ws[ws.length-1][0])-pk(ws[0][0]))/864e5;
  let pts;
  if(span>150){const wk={};ws.forEach(([k,v])=>{const m=monday(k);(wk[m]=wk[m]||[]).push(v)});pts=Object.keys(wk).sort().map(m=>[m,wk[m].reduce((a,b)=>a+b,0)/wk[m].length])}
  else pts=ws.map(([k])=>[k,avgAround(k)]);
  const W=340,H=170,pl=34,pr=8,pt=10,pb=22;
  const t0=pk(pts[0][0]).getTime(),t1=Math.max(pk(pts[pts.length-1][0]).getTime(),t0+86400000*6);
  const vals=(span>150?pts:ws).map(x=>x[1]);let lo=Math.floor(Math.min(...vals)-.5),hi=Math.ceil(Math.max(...vals)+.5);if(hi-lo<3)hi=lo+3;
  const X=k=>pl+(pk(k).getTime()-t0)/(t1-t0)*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const step=Math.max(1,Math.ceil((hi-lo)/6));let grid='';
  for(let v=lo;v<=hi;v+=step)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;
  const path=pts.map(([k,v],i)=>(i?'L':'M')+X(k).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=path+` L${X(pts[pts.length-1][0]).toFixed(1)} ${H-pb} L${X(pts[0][0]).toFixed(1)} ${H-pb} Z`;
  const dots=span>150?'':ws.map(([k,v])=>`<circle cx="${X(k).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.5" fill="var(--muted)" opacity=".55"/>`).join('');
  const last=pts[pts.length-1];const lab=k=>pk(k).toLocaleDateString('es-ES',span>300?{month:'short',year:'numeric'}:{day:'numeric',month:'short'});
  return seg+`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">${grid}
    <path d="${area}" fill="var(--accent)" opacity=".08"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl}" y="${H-6}">${lab(pts[0][0])}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${lab(pts[pts.length-1][0])}</text></svg>
    <div class="row small muted" style="gap:14px"><span class="row" style="gap:6px"><span class="dot" style="background:var(--accent)"></span>${span>150?'Media semanal':'Media 7 días'}</span>${span>150?'':'<span class="row" style="gap:6px"><span class="dot" style="background:var(--muted);opacity:.55;border-radius:5px"></span>Peso diario</span>'}</div>`;
}
function vProgreso(){

  let comp='';
  if(lm&&lm.bf){

        <div class="spread"><span class="muted">Combinado${lm.n>1?` y media de ${lm.n} medidas (2 semanas)`:''}${lm.cal?' y calibrado':''}</span><b class="num">${nf(lm.bf,1)} %</b></div>

  }else comp=`<div class="callout">Mídete cintura y cuello (abajo o en Hoy) para estimar tu % de grasa y decidir la fase.</div>`;

  }
  else if(sh&&lm){const r=sh/lm.waist;ad=`<div class="spread"><span>Hombros ÷ cintura</span><b class="num" style="font-family:var(--display);font-size:22px;color:${r>=1.6?'var(--ok)':'var(--ink)'}">${nf(r,2)}</b></div>
    <div class="track" style="height:10px"><i style="width:${Math.min(100,(r-1.2)/(1.7-1.2)*100)}%;background:var(--accent)"></i></div>
    <div class="small muted">Meta 1,6. Con tu cintura de ${kgs(lm.waist)} cm, unos hombros de ${nf(lm.waist*1.6,0)} cm. Se consigue subiendo hombros y bajando cintura a la vez.</div>`}
  else ad=`<p class="small muted" style="margin:0">Mide el contorno de hombros junto con la cintura para seguir tu forma en V. La meta es que los hombros midan 1,6 veces la cintura.</p>`;
  const lifts=MAIN_LIFTS.map(([key,n])=>{

    return `<tr><td>${n}</td><td class="r">${nf(f,0)}</td><td class="r">${nf(l,0)}</td><td class="r" style="color:${pct>=0?'var(--ok)':'var(--bad)'}">${pct>=0?'+':''}${nf(pct,0)} %</td></tr>`;

    <section class="card stack"><h3>Composición</h3>${comp}</section>

        <p class="small muted" style="margin:0">Un plicómetro cuesta unos 10 € (Amazon o Decathlon). Siempre en el lado derecho, de pie y relajado. Pellizca la piel y la grasa con dos dedos, separándola del músculo, pon el plicómetro 1 cm al lado y lee a los 2 segundos. Mide cada pliegue 2 veces y pon la media.
        ${isF()?'Tríceps: vertical, detrás del brazo, a mitad entre hombro y codo. Suprailíaco: diagonal, justo encima del hueso de la cadera. Muslo: vertical, delante, a mitad entre ingle y rodilla.':'Pecho: diagonal, a mitad entre la axila y el pezón. Abdomen: vertical, 2 cm a la derecha del ombligo. Muslo: vertical, delante, a mitad entre ingle y rodilla.'}</p></div></details>
      <details><summary class="small">Cómo medirte para que salga exacto</summary><ul class="small muted" style="margin:6px 0 0;padding-left:18px;display:grid;gap:4px">
        <li>Siempre igual: el mismo día de la semana, en ayunas, después de ir al baño y antes de beber o entrenar.</li>
        <li>De pie, relajado, sin meter tripa, respirando normal: mide al final de soltar el aire.</li>
        <li>Cinta flexible, recta y pegada a la piel, sin apretar. Frente a un espejo para verla horizontal.</li>
        <li><b>Cintura:</b> justo a la altura del ombligo. <b>Cuello:</b> justo debajo de la nuez, con la cinta un poco inclinada hacia delante.${isF()?' <b>Cadera:</b> por la parte más ancha del glúteo.':''}</li>

  </div>`;

function wksTxt(w){w=Math.max(1,Math.round(w));return w<=10?`${w} semanas`:`${w} semanas (unos ${Math.round(w/4.35)} meses)`}
function phasePlan(){
  const s=state.settings,m=s.mode,bf=curBf(),t=bfT(),lo=t-1,hi=t+2,w=curWeight();
  if(m==='cut'){if(bf==null)return{dur:'Hasta llegar a tu '+lo+' %',det:'Mídete la cintura y la app calcula las semanas.',next:'Volumen limpio o mantenimiento'};
    const fast=bf>=t+10,rate=w*(fast?.0075:.005)*.8,kg=w*(bf-lo)/100,wk=kg/rate;
    return{dur:`Unas ${wksTxt(wk)}`,det:`Hasta bajar del ${nf(bf,1)} % al ${lo} %: unos ${nf(kg,1)} kg de grasa a ~${nf(rate,2)} kg por semana.${wk>16?' Cada 12-16 semanas, haz 2 semanas a calorías de mantenimiento: descansas la cabeza y el cuerpo, y luego sigues.':''}`,next:'Volumen limpio (o mantenimiento si estás en tu techo)'}}
  if(m==='bulk'){const b=bf==null?t:bf,wk=Math.min(36,Math.max(12,(hi-b)/0.125));
    return{dur:`Unas ${wksTxt(wk)}`,det:`Hasta subir del ${nf(b,1)} % al ${hi} % de grasa, ganando ~${nf(w*.0025,2)} kg por semana. Un volumen de menos de 3 meses no da tiempo a ganar músculo; de más de 9, acumulas demasiada grasa.`,next:`Definición corta hasta el ${lo} %`}}
  if(m==='recomp'){const left=Math.max(0,12-monthsTraining());
    return{dur:bf!=null&&bf>t?`Hasta tu ${t} %, unas ${wksTxt(Math.max(8,(bf-t)/0.15))}`:'8-12 semanas',det:`Recomponer funciona mejor el primer año${left>0?` (te quedan unos ${Math.round(left)} meses)`:''}. La app mira tus medidas cada semana y cambia de fase sola cuando toca.`,next:'Volumen limpio o definición, según tu % de grasa'}}
  return{dur:'Indefinido',det:`Te mantienes en tu ${t} % con el músculo ganado. Si subes del ${hi} %, la app hace una definición corta.`,next:'—'}
}

let tmr={end:0,total:0,id:null,ac:null,nodes:[],next:null,spoke:false,label:''};
function audio(){try{try{if(navigator.audioSession&&navigator.audioSession.type!=='ambient')navigator.audioSession.type='ambient'}catch(e){} /* mezcla con Spotify en vez de pararlo */
  tmr.ac=tmr.ac||new (window.AudioContext||window.webkitAudioContext)();if(tmr.ac.state==='suspended')tmr.ac.resume();return tmr.ac}catch(e){return null}}
function tone(at,freq,dur,vol){const ac=tmr.ac;if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.02);g.gain.setValueAtTime(vol,at+dur-.05);g.gain.linearRampToValueAtTime(0,at+dur);o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+dur+.02);tmr.nodes.push(o)}catch(e){}}
function clearTones(){tmr.nodes.forEach(o=>{try{o.stop()}catch(e){}});tmr.nodes=[]}
function scheduleTones(){
  clearTones();const s=state.settings;if(s.tSound===false||!tmr.ac)return;
  const left=(tmr.end-Date.now())/1000,t0=tmr.ac.currentTime;
  if(s.tWarn===true&&left>11){tone(t0+left-10,660,.12,.35);tone(t0+left-9.8,660,.12,.35)}
  if(left>0){tone(t0+left,880,.18,.6);tone(t0+left+.28,880,.18,.6);tone(t0+left+.56,1320,.45,.7)}
}
function speak(text,prime){try{if(state.settings.tVoice===false||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(prime?' ':text);u.lang='es-ES';u.rate=1.05;if(prime)u.volume=0;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function nextSet(hk,i){
  const R=ROUTINE[dayType()];if(!R)return null;const d=day();const exs=R.ex.map(a=>exObj(a));
  const start=exs.findIndex(x=>x.hk===hk);
  for(let j=Math.max(0,start);j<exs.length;j++){const arr=d.sets[exs[j].hk]||[];for(let n=(j===start?i+1:0);n<arr.length;n++){if(!arr[n].done)return{hk:exs[j].hk,i:n,name:exs[j].n,kg:arr[n].kg,same:j===start}}}
  for(let j=0;j<Math.max(0,start);j++){const arr=d.sets[exs[j].hk]||[];for(let n=0;n<arr.length;n++)if(!arr[n].done)return{hk:exs[j].hk,i:n,name:exs[j].n,kg:arr[n].kg,same:false}}
  return null;
}
function startRest(sec,label,nx){
  try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}catch(e){}
  audio();speak('',true);
  tmr.total=sec;tmr.end=Date.now()+sec*1000;tmr.next=nx;tmr.spoke=false;tmr.label=label;
  $('#tin').classList.remove('go','late');$('#tstop').textContent='Saltar';
  $('#tl').textContent=nx?`Descanso · luego ${nx.same?'serie '+(nx.i+1):nx.name.split(',')[0]+', serie '+(nx.i+1)}${nx.kg!=null?' con '+kgs(nx.kg)+' kg':''}`:'Descanso · último ejercicio hecho';
  $('#timer').hidden=false;clearInterval(tmr.id);scheduleTones();tick();tmr.id=setInterval(tick,250);

function tick(){
  const leftMs=tmr.end-Date.now(),left=Math.ceil(leftMs/1000);
  const bar=$('#tbar');if(bar)bar.style.width=Math.max(0,Math.min(100,(1-leftMs/(tmr.total*1000))*100))+'%';
  if(left<=0){
    const ov=Math.floor(-leftMs/1000);$('#tm').textContent='+'+Math.floor(Math.max(0,ov)/60)+':'+String(Math.max(0,ov)%60).padStart(2,'0');$('#tin').classList.toggle('late',ov>=30);
    if(tmr.spoke)return;

    $('#tl').textContent=nx?`${nx.same?'Serie '+(nx.i+1):nx.name.split(',')[0]+' · serie '+(nx.i+1)}${nx.kg!=null?' · '+kgs(nx.kg)+' kg':''}`:'Entreno terminado. ¡Buen trabajo!';
    if(!tmr.spoke&&leftMs>-5000){tmr.spoke=true;

      if(state.settings.tVib!==false&&!/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)){try{navigator.vibrate&&navigator.vibrate([300,150,300,150,500])}catch(e){}} /* en iPhone la vibración activa «Agitar para deshacer» */
      if(nx){const row=document.getElementById('kg-'+nx.hk+'-'+nx.i);if(row){const s=row.closest('.set');if(s){s.classList.add('next');s.scrollIntoView({behavior:'smooth',block:'center'})}}}

    case'habits-open':ui.habits=true;render();window.scrollTo(0,0);break;
    case'habits-close':ui.habits=false;render();window.scrollTo(0,0);break;
    case'cinta':d().cinta=!d().cinta;saveDay();render();break;
    case'walk-quick':{const wp=walkPlan();d().walk={steps:wp.steps,min:wp.min};saveDay();render();break}
    case'walk-save':{const wp=walkPlan();const st=parseNum($('#wst').value)||wp.steps,m=parseNum($('#wm').value)||Math.round(st/110);d().walk={steps:st,min:m};saveDay();render();break}
    case'walk-del':delete d().walk;ui.showWalk=false;saveDay();render();break;
    case'wspeed':{const sp=parseFloat(v);if(peek(ui.cur)&&peek(ui.cur).walk){d().walk.speed=sp;saveDay()}else ui._speed=sp;render();break}
    case'show-walk':ui.showWalk=true;render();break;
    case'type':{const def=planType(pk(ui.cur).getDay());if(v===def)delete d().type;else d().type=v;saveDay();render();break}
    case'swap-open':ui.swapOpen=ui.swapOpen===v?null:v;render();break;
    case'swap':{const sw={...(state.settings.swaps||{})};const i=+el.dataset.i;if(i)sw[v]=i;else delete sw[v];state.settings.swaps=sw;ui.swapOpen=null;saveSettings();render();break}
    case'done':{const arr=d().sets[el.dataset.ex];if(!arr)break;const i=+el.dataset.i,s=arr[i];
      const kgI=$('#kg-'+CSS.escape(el.dataset.ex)+'-'+i),rpI=$('#rp-'+CSS.escape(el.dataset.ex)+'-'+i);
      if(kgI)s.kg=parseNum(kgI.value);if(rpI)s.reps=parseNum(rpI.value);
      if(!s.done&&s.reps==null&&rpI){const ph=rpI.placeholder.split('-');s.reps=parseInt(ph[1]||ph[0])||null}
      s.done=!s.done;
      const nx=arr[i+1];if(s.done&&nx&&nx.kg==null)nx.kg=s.kg;
      saveDay();render();if(s.done){const nx=nextSet(el.dataset.ex,i);if(nx)startRest(+el.dataset.rest,el.dataset.n,nx);else{clearInterval(tmr.id);clearTones();$('#timer').hidden=true}}break}
    case't-add':if(tmr.end<Date.now()){tmr.end=Date.now();tmr.total=0}tmr.end+=15000;tmr.total+=15;tmr.spoke=false;$('#tin').classList.remove('go');$('#tstop').textContent='Saltar';audio();scheduleTones();clearInterval(tmr.id);tick();tmr.id=setInterval(tick,250);break;
    case't-stop':clearInterval(tmr.id);clearTones();$('#timer').hidden=true;break;
    case'tset':{state.settings[v]=v==='tWarn'?state.settings[v]!==true:state.settings[v]===false;saveSettings();if(v==='tAwake')keepAwake(ui.tab==='entreno'&&state.settings.tAwake!==false);render();break}
    case'ttest':audio();speak('',true);tmr.total=5;tmr.end=Date.now()+5000;tmr.next={same:true,i:1,kg:20,name:'Prueba'};tmr.spoke=false;$('#tin').classList.remove('go');$('#tl').textContent='Prueba de aviso: 5 segundos';$('#timer').hidden=false;clearInterval(tmr.id);scheduleTones();tick();tmr.id=setInterval(tick,250);break;
    case'add':ui.sheet={meal:v||mealNow()};ui.q='';ui.cat='todos';renderSheet();break;
    case'sheet-close':ui.sheet=null;renderSheet();break;
    case'swap-food':ui.sheet={swap:v};renderSheet();break;
    case'sub':{const from=ui.sheet&&ui.sheet.swap;if(!from)break;const s={...(state.settings.subs||{})};if(v===from)delete s[from];else s[from]=v;state.settings.subs=s;saveSettings();ui.sheet=null;ui.toast=v===from?'Vuelves a '+F[from].n.toLowerCase()+'.':F[from].n+' → '+F[v].n+' en todos tus menús.';render();break}
    case'unsub':{const s={...(state.settings.subs||{})};delete s[v];state.settings.subs=s;saveSettings();render();break}
    case'cat':ui.cat=v;renderSheet();break;
    case'pick':ui.sheet.pick=v;ui.sheet.q=1;renderSheet();break;
    case'sq-':{const st=F[ui.sheet.pick].step||.5;ui.sheet.q=Math.max(st,ui.sheet.q-st);renderSheet();break}
    case'sq+':{const st=F[ui.sheet.pick].step||.5;ui.sheet.q+=st;renderSheet();break}
    case'smeal':{if(ui.sheet.pick==='__custom')ui.sheet.draft=readCustom();ui.sheet.meal=v;renderSheet();if(ui.sheet.draft)fillCustom(ui.sheet.draft);break}
    case'sback':ui.sheet.pick=null;renderSheet();break;
    case'sadd':{
      if(ui.sheet.pick==='__custom'){const c=readCustom();if(!c.n||!c.k){$('#ck').focus();$('#ck').placeholder='Pon las kcal';return}d().foods.push({id:uid(),c,q:1,m:ui.sheet.meal})}
      else d().foods.push({id:uid(),f:ui.sheet.pick,q:ui.sheet.q,m:ui.sheet.meal});
      saveDay();ui.sheet=null;render();break}
    case'q-':case'q+':{const it=d().foods.find(x=>x.id===el.dataset.id);if(!it)break;const st=it.c?1:(F[it.f].step||.5);
      it.q=+(it.q+(a==='q+'?st:-st)).toFixed(2);if(it.q<=0)d().foods=d().foods.filter(x=>x!==it);saveDay();render();break}
    case'mswap':{const sw={...(state.settings.mswap||{})};const key=blockOf(ui.cur).key+'|'+v;sw[key]=(sw[key]||0)+1;const ks=Object.keys(sw).sort();while(ks.length>40)delete sw[ks.shift()];state.settings.mswap=sw;saveSettings();render();break}
    case'mex':{const o=optFor(ui.cur,v);const mx={...(state.settings.mex||{})};const arr=[...(mx[v]||[])];if(arr.length>=OPTS[v].length-2){ui.toast='Deja al menos 2 opciones de '+v+' para que haya variedad.';render();break}arr.push(o.id);mx[v]=arr;state.settings.mex=mx;saveSettings();ui.toast='Quitado: '+o.n+'. No volverá a salir.';render();break}
    case'mex-reset':state.settings.mex={};saveSettings();render();break;
    case'menu-load':loadMenu();render();break;
    case'copy-yday':{const y=peek(add(ui.cur,-1));if(!y||!(y.foods||[]).length){el.textContent='Ayer no hay nada apuntado';break}
      y.foods.forEach(e=>d().foods.push({...clone(e),id:uid()}));saveDay();render();break}
    case'clear-day':{if(!el.dataset.sure){el.dataset.sure='1';el.textContent='Toca otra vez para vaciar';return}d().foods=[];saveDay();render();break}
    case'mode':state.settings.mode=v;state.settings.autoPhase=false;state.settings.off=0;saveSettings();render();break;
    case'auto-phase':state.settings.autoPhase=!state.settings.autoPhase;saveSettings();autoPhase();render();break;
    case'apply-adj':state.settings.off=(state.settings.off||0)+(+v);state.settings.adjWeek=monday(TODAY);saveSettings();ui.toast='Dieta ajustada. Tus menús ya tienen las nuevas cantidades.';render();break;
    case'shop-open':ui.shop=true;render();window.scrollTo(0,0);break;
    case'shop-close':ui.shop=false;render();window.scrollTo(0,0);break;
    case'shop-days':state.settings.shopDays=+v;saveSettings();render();break;
    case'shop-tick':{const dn={...(state.settings.shopDone||{})};if(dn[v])delete dn[v];else dn[v]=1;state.settings.shopDone=dn;saveSettings();render();break}
    case'shop-reset':state.settings.shopDone={};saveSettings();render();break;
    case'export':{const t=JSON.stringify(state);const io=$('#io');io.hidden=false;io.value=t;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{el.textContent='Copiado'}).catch(()=>{io.select();el.textContent='Selecciona y copia'});break}
    case'import':$('#io').hidden=false;$('#io').value='';$('#io-ok').hidden=false;$('#io').focus();break;
    case'import-ok':{try{importData($('#io').value)}catch(_){el.textContent='Texto no válido'}break}
    case'backup':doBackup(el);break;
    case'set-fruit':state.settings.fruitPref=v;saveSettings();render();break;
    case'menu-fixed':state.settings.menuFixed=state.settings.menuFixed===false;saveSettings();render();break;
    case'cal-set':{const v=parseNum($('#cal-in').value);const ms=measures();const m=ms.filter(x=>x.k>add(TODAY,-14)).pop();
      if(!(v>2&&v<65)){ui.toast='Pon el % de la DEXA, por ejemplo 17,4.';render();break}
      if(!m){ui.toast='Antes mide tu cintura y cuello (hoy o en los últimos 14 días) para poder calibrar.';render();break}
      state.settings.bfCal={off:+(v-m.raw).toFixed(2),dexa:v,at:TODAY};saveSettings();autoPhase();ui.toast='Calibrado. Tus estimaciones ya usan tu DEXA.';render();break}
    case'cal-del':delete state.settings.bfCal;saveSettings();render();break;
    case'whey-add':d().foods.push({id:uid(),f:'whey',q:+v,m:'extra'});saveDay();ui.toast='Apuntado. Ya llegas a tu proteína.';render();break;
    case'onb-next':onbNext();render();window.scrollTo(0,0);break;
    case'onb-back':{const o=onbData();o.err='';o.step=Math.max(0,o.step-1);render();break}
    case'onb-set':{const o=onbData();o.d[el.dataset.k]=el.dataset.n?+v:v;if(el.dataset.k==='sex'){o.d.bf=null;o.d.focus=null;o.d.body=''}render();break}
    case'onb-finish':onbFinish();break;
    case'wr':ui.wr=+v;render();break;
    case'fifth-on':state.settings.days=Math.min(5,(state.settings.days||4)+1);saveSettings();ui.toast='Ahora entrenas '+state.settings.days+' días a la semana.';render();break;
    case'fifth-no':state.settings.fifthNo=state.settings.days||4;saveSettings();render();break;
    case'set-days':state.settings.days=+v;saveSettings();render();break;
    case'set-focus':state.settings.focus=v;saveSettings();render();break;
    case'set-sex':state.settings.sex=v;if(!state.settings.bfTarget||[12,21].includes(state.settings.bfTarget))state.settings.bfTarget=v==='f'?21:12;saveSettings();render();break;
    case'set-bf':state.settings.bfTarget=+v;saveSettings();autoPhase();render();break;
    case'check':{const c={...(state.settings.checks||{})};c[v]=TODAY;state.settings.checks=c;saveSettings();render();break}
  }
});
function readCustom(){const g=id=>($('#'+id)||{}).value;return{n:(g('cn')||'').trim(),k:parseNum(g('ck'))||0,P:parseNum(g('cp'))||0,C:parseNum(g('cc'))||0,F:parseNum(g('cf'))||0}}
function fillCustom(c){if(!$('#cn'))return;$('#cn').value=c.n;$('#ck').value=c.k||'';$('#cp').value=c.P||'';$('#cc').value=c.C||'';$('#cf').value=c.F||''}

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='fsearch'){ui.q=el.value;const pos=el.selectionStart;renderSheet(true);const s=$('#fsearch');if(s)s.setSelectionRange(pos,pos);return}
  if(el.dataset.o){onbData().d[el.dataset.o]=el.value;return}
  if(el.dataset.ex){const arr=day().sets[el.dataset.ex];if(!arr)return;arr[+el.dataset.i][el.dataset.k]=parseNum(el.value);saveDay();return}
  if(el.dataset.f){const val=parseNum(el.value);const dd=day();if(val==null)delete dd[el.dataset.f];else dd[el.dataset.f]=val;saveDay();return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f){needRender=true;if(['waist','neck','hip','sk1','sk2','sk3'].includes(el.dataset.f))autoPhase();return}
  if(el.dataset.t){const dd=day();if(el.value)dd[el.dataset.t]=el.value;else delete dd[el.dataset.t];saveDay();needRender=true;return}
  if(el.dataset.sn){state.settings[el.dataset.sn]=el.value.trim();saveSettings();needRender=true;return}
  if(el.dataset.s){const val=parseNum(el.value);if(val!=null){state.settings[el.dataset.s]=val;if(el.dataset.s==='age')state.settings.ageAt=TODAY;saveSettings();needRender=true}return}
  if(el.dataset.walk){const dd=day();if(dd.walk){const v=parseNum(el.value);if(v){dd.walk[el.dataset.walk]=v;saveDay()}}needRender=true;return}
});
document.addEventListener('toggle',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.sec){ui.secs=ui.secs||{};ui.secs[t.dataset.sec]=t.open}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet){ui.sheet=null;renderSheet()}if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('inp')&&e.target.id!=='fsearch'&&e.target.tagName!=='TEXTAREA')e.target.blur()});

/* ================= ARRANQUE ================= */
async function standaloneBoot(){
  if(!STANDALONE)return;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
  const raw=await IDB.get('state');
  if(raw)try{const s=JSON.parse(raw);let changed=false;
    if(s.settings&&(s.settings._t||0)>(state.settings._t||0)){state.settings={...DEF,...s.settings};changed=true}
    for(const k in (s.days||{})){const r=s.days[k],l=state.days[k];if(!l||(r&&(r._t||0)>(l._t||0))){state.days[k]=r;changed=true}}
    if(changed){lsSave();render()}}catch(e){}
  /* Pasos desde la app Salud a través de un Atajo de iPhone: abre ...?pasos=8432 */
  try{const q=new URLSearchParams(location.search),v=parseInt((q.get('pasos')||'').replace(/\D/g,''));
    if(v>=0&&v<200000&&q.has('pasos')){const dd=day(TODAY);dd.steps=v;saveDay(TODAY);ui.cur=TODAY;ui.tab='hoy';
      ui.toast=`Pasos de hoy desde Salud: ${th(v)}${v>=stepTarget(TODAY)?' · meta cumplida':` · te faltan ${th(stepTarget(TODAY)-v)}`}`;
      window.history.replaceState(null,'',location.pathname);render()}}catch(e){}
}
standaloneBoot();
render();
initCloud();
setTimeout(()=>{if(!col&&!migrated)migrate()},12000);
setTimeout(()=>{if(cloudState==='local'&&!col)setSync()},11000);

</script>
